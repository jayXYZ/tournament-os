appId: com.paperpairings.app
name: Private event, its public code and its invite
---
- runFlow: subflows/signed-in.yaml
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: paperpairings://join/${CODE_PRIVATE}
- runFlow: subflows/code-not-found.yaml
- runFlow: subflows/go-home.yaml
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: paperpairings://join/${INVITE_PRIVATE}
- extendedWaitUntil:
    visible: "Register for this event"
    timeout: 30000
- assertVisible: "E2E Private Event"
