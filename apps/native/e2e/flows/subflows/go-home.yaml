# Back to home between two codes in one flow, so the second code's screen is
# a fresh one rather than the first's still showing. Maestro's hierarchy
# keeps screens lower in the stack, so this checks the join screen is gone,
# not merely covered.
appId: com.paperpairings.app
---
- runFlow:
    file: open-link.yaml
    env:
      LINK: paperpairings:///
- extendedWaitUntil:
    visible: "Your tournaments"
    timeout: 30000
- assertNotVisible: "Code not found|Register for this event|Join event"
