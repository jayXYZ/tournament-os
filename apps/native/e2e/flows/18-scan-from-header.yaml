appId: com.paperpairings.app
name: Scanner opens from the home header and closes
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Scan a QR code"
# Camera allowed (run.mjs's default). The simulator has no camera, so the
# preview is black, but the scanner around it is the one a phone shows.
- extendedWaitUntil:
    visible: "Point the camera at the event’s QR code"
    timeout: 20000
- assertVisible: "Turn on flashlight"
- assertVisible: "Type a code instead"
- assertNotVisible: "Camera access is off"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Your tournaments"
    timeout: 20000
- assertNotVisible: "Type a code instead"
