name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Duplicate versions of one package split React context between module
      # copies (e.g. convex/react during SSR); fail fast when the lockfile
      # can be deduped.
      - run: pnpm dedupe --check
      - run: pnpm test
