packages:
  - packages/*
  - apps/*
# Expo / React Native (Metro) resolves modules from a flat node_modules tree.
# pnpm's default isolated store breaks Metro resolution in a monorepo, so we
# use a hoisted layout. This is Expo's officially recommended pnpm setup.
# https://docs.expo.dev/guides/monorepos/
nodeLinker: hoisted
# The patch carries a local Swift 6 fix to ClerkNativeBridge.swift, so the
# dependency is pinned exactly (in apps/native) and the entry is
# version-qualified: bumping @clerk/expo must fail loudly here until the patch
# is re-derived against the new version instead of silently (mis)applying.
patchedDependencies:
  "@clerk/expo@3.4.6": patches/@clerk__expo.patch
# Pin a single React version across the workspace. pnpm otherwise installs
# multiple peer-instances of react/react-dom (and therefore convex), which
# Metro loads as separate module copies, breaking React context (e.g.
# ConvexProvider lookups and hooks) in apps/native. See apps/native/metro.config.js.
#
# The exact version is dictated by react-native@0.85.3: its bundled renderer is
# stamped with React "19.2.3" (Libraries/Renderer/implementations/*.js) and RN
# asserts at runtime that `react` matches the renderer's version exactly. Bumping
# react past 19.2.3 throws "react and react-native-renderer must have the exact
# same version". Keep this in lockstep with the React Native upgrade.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  "@clerk/clerk-react>react-dom": 19.2.3
  "@clerk/react>react-dom": 19.2.3
  "@clerk/shared>react-dom": 19.2.3
# Single declared range per shared dependency; manifests reference these via
# the catalog: protocol so package versions cannot drift apart again. The
# react/react-dom/react-native entries are exact and must stay in lockstep
# with the overrides block above (see its comment); expo/react-native ranges
# are Expo-managed, so bump them here when upgrading the SDK.
catalog:
  convex: ^1.42.0
  expo: ~56.0.20
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.85.3
  typescript: ^6.0.3
  vite: ^8.0.16
  vitest: ^4.1.8
allowBuilds:
  "@clerk/shared": true
  "@sentry/cli": true
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  msw: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - "@expo/cli@56.1.24"
  - "@expo/config-plugins@56.0.15"
  - "@expo/prebuild-config@56.0.22"
  - "@expo/router-server@56.0.18"
  - "@expo/ui@56.0.26"
  - expo-asset@56.0.23
  - expo-auth-session@56.0.17
  - expo-constants@56.0.24
  - expo-dev-client@56.0.25
  - expo-dev-launcher@56.0.26
  - expo-dev-menu@56.0.22
  - expo-file-system@56.0.10
  - expo-image@56.0.12
  - expo-linking@56.0.17
  - expo-modules-autolinking@56.0.22
  - expo-modules-core@56.0.24
  - expo-router@56.2.19
  - expo-server@56.0.6
  - expo@56.0.20
